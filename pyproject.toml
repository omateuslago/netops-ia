[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "netops-ai"
version = "0.1.0"
description = "Assistente local de suporte a redes corporativas baseado em RAG"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "fastapi>=0.162,<0.163",
    "fastembed>=0.9.1,<0.10",
    "huggingface-hub>=1.33,<2",
    "langchain-core>=1,<2",
    "langchain-qdrant>=1.1,<1.2",
    "pypdf>=6.19,<7",
    "pydantic-settings>=2.16,<3",
    "python-multipart>=0.0.32,<0.1",
    "qdrant-client>=1.20,<1.21",
    "tokenizers>=0.23,<0.24",
    "uvicorn[standard]>=0.53,<0.54",
]

[project.optional-dependencies]
lab = ["reportlab==4.4.9"]
dev = [
    "httpx2>=2.14,<3",
    "pytest>=9,<10",
    "ruff>=0.16.8,<0.17",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
netops_ai = ["web/*.html"]

[tool.pytest.ini_options]
addopts = "-ra -q"
testpaths = ["tests"]
markers = ["semantic: integração com embeddings reais em CPU, sem download automático"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

